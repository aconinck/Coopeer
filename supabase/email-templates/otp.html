<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Coopeer</title>
</head>
<body style="margin:0;padding:0;background-color:#0B0603;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0B0603;">
    <tr>
      <td align="center" style="padding:48px 20px;">

        <!-- Email card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#181818;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.09);">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:44px 40px 32px;border-bottom:1px solid rgba(255,255,255,0.07);">
              <!-- Coopeer logo SVG -->
              <svg width="52" height="52" viewBox="250 220 500 520" xmlns="http://www.w3.org/2000/svg" aria-label="Coopeer">
                <path d="M686.389 475.252C686.066 509.793 686.228 540.445 684.893 570.979C684.713 575.73 678.423 582.639 673.489 584.462C615.471 605.597 557.453 626.733 498.897 646.118C464.454 657.554 449.71 646.033 447.038 609.882C445.705 591.928 445.018 573.745 442.361 555.934C438.933 532.739 428.334 526.542 405.941 532.268C404.452 532.632 403.112 533.186 401.649 533.622C357.682 546.778 335.535 576.15 335.208 621.736C335.083 638.994 335.054 656.298 334.857 673.581C334.65 695.259 304.689 712.692 280.286 717C280.286 717 279.795 657.769 280.099 630.265C280.638 582.153 281.658 534.031 281.402 485.956C281.329 471.112 285.209 462.873 300.434 458.143C334.217 447.586 385.785 433.843 419.441 422.927C450.197 412.955 460.86 420.018 464.667 452.292C466.537 467.875 466.314 483.713 466.814 499.538C467.984 535.329 481.506 545.909 515.835 534.836C555.245 522.131 594.047 507.701 633.102 493.989C649.346 488.253 665.663 482.491 686.363 475.18L686.389 475.252Z" fill="#FFFFFF"/>
                <path d="M720.975 313.936C720.677 348.548 720.839 379.2 719.602 409.781C719.396 414.46 713.127 421.2 708.193 423.023C657.363 441.62 606.435 460.17 554.995 477.043C525.584 486.702 510.336 475.358 507.426 444.707C505.707 426.808 505.215 408.717 503.184 390.848C499.881 362.517 488.926 355.314 462.056 364.156C428.451 375.216 395.248 387.184 361.845 398.818C354.873 401.28 347.901 403.743 337.191 407.525C337.565 373.128 337.369 341.922 338.813 310.783C339.002 306.514 346.76 300.784 352.197 298.783C396.034 282.818 439.998 267.211 484.17 252.42C508.976 244.145 519.77 250.435 523.8 276.246C526.575 293.934 526.395 312.181 527.005 330.148C528.175 365.94 541.816 376.397 576.161 364.914C623.259 349.252 669.823 332.08 721 314.007L720.975 313.936Z" fill="#FFFFFF"/>
              </svg>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              <h1 style="margin:0 0 10px;color:#FFFFFF;font-size:26px;font-weight:700;line-height:1.2;">Your sign-in code</h1>
              <p style="margin:0 0 36px;color:rgba(255,255,255,0.5);font-size:15px;line-height:1.6;">Use this code to sign in to Coopeer. It&rsquo;s valid for 10&nbsp;minutes and can only be used once.</p>

              <!-- Code block -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:36px;">
                <tr>
                  <td align="center" style="background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.16);border-radius:14px;padding:28px 20px;">
                    <div style="color:#FFFFFF;font-size:52px;font-weight:700;letter-spacing:14px;font-variant-numeric:tabular-nums;line-height:1;">{{ .Token }}</div>
                    <div style="margin-top:12px;color:rgba(255,255,255,0.35);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;">One-time code</div>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                <tr>
                  <td style="border-top:1px solid rgba(255,255,255,0.08);"></td>
                  <td style="padding:0 16px;white-space:nowrap;color:rgba(255,255,255,0.25);font-size:12px;">or use the button</td>
                  <td style="border-top:1px solid rgba(255,255,255,0.08);"></td>
                </tr>
              </table>

              <!-- CTA button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FFFFFF;color:#0D0D0D;text-decoration:none;font-size:16px;font-weight:600;padding:16px 40px;border-radius:100px;min-width:200px;text-align:center;">Sign in to Coopeer</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px 36px;border-top:1px solid rgba(255,255,255,0.06);">
              <p style="margin:0;color:rgba(255,255,255,0.22);font-size:12px;line-height:1.7;text-align:center;">
                Didn&rsquo;t request this? You can safely ignore this email &mdash; your account hasn&rsquo;t been touched.<br>
                &copy; Coopeer &bull; Bentonville, AR
              </p>
            </td>
          </tr>

        </table>
        <!-- /card -->

      </td>
    </tr>
  </table>
</body>
</html>
